<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marie & Anton — Weißer Bogen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../invite.css?v=5">
  <style>
    .env-flap, .door, .iris, .half, .strip, .col, .pane { background-image: url("couple.jpg"); }
  </style>
  <script>if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("reduce");</script>
  <noscript><style>.card{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}.opener{display:none}</style></noscript>
</head>
<body>
  <main class="stage" data-invite="ring" style="--photo:url('couple.jpg');--focus:center 30%">
    <img class="photo-bg" src="couple.jpg" alt="">
    <div class="opener">
      <div class="mech"><div class="burst"></div><div class="burst late"></div></div>
      <div class="seal-wrap">
        <button class="seal" type="button" aria-expanded="false" aria-label="Öffnet das Siegel">
          <span class="wax"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="12" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="32" cy="32" r="4" fill="currentColor"/></svg></span>
          <span class="hint">Öffnet das Siegel</span>
        </button>
      </div>
    </div>
    <article class="card">
      <p class="eyebrow">Vorlage · Weißer Bogen</p>
      <p class="craft">Pergament · Ring</p>
      <p class="invite-line">ihr seid eingeladen</p>
      <h1>Marie<i>&amp;</i>Anton</h1>
      <div class="rule"></div>
      <p class="when">Samstag, 8. Juni 2027<br>15:00 Uhr</p>
      <p class="where">Unter dem weißen Bogen</p>
      <p class="note">Namen, Tag und Ort sind Beispiele für diese Vorlage.</p>
    </article>
  </main>
  <script src="../invite.js"></script>
</body>
</html>
