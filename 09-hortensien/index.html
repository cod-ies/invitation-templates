<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ida & Felix — Hortensien</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../invite.css?v=5">
  <style>
    .env-flap, .door, .iris, .half, .strip, .col, .pane { background-image: url("couple.jpg"); }
  </style>
  <script>if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("reduce");</script>
  <noscript><style>.card{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}.opener{display:none}</style></noscript>
</head>
<body>
  <main class="stage" data-invite="arch" style="--photo:url('couple.jpg');--focus:center 36%">
    <img class="photo-bg" src="couple.jpg" alt="">
    <div class="opener">
      <div class="mech arch"><div class="door left"></div><div class="door right"></div></div>
      <div class="seal-wrap">
        <button class="seal" type="button" aria-expanded="false" aria-label="Öffnet das Siegel">
          <span class="wax"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" d="M16 50V30a16 16 0 0 1 32 0v20"/></svg></span>
          <span class="hint">Öffnet das Siegel</span>
        </button>
      </div>
    </div>
    <article class="card">
      <p class="eyebrow">Vorlage · Hortensien</p>
      <p class="craft">Bogen · Siegel</p>
      <p class="invite-line">ihr seid eingeladen</p>
      <h1>Ida<i>&amp;</i>Felix</h1>
      <div class="rule"></div>
      <p class="when">Samstag, 22. Mai 2027<br>16:00 Uhr</p>
      <p class="where">Auf dem Hortensienweg</p>
      <p class="note">Namen, Tag und Ort sind Beispiele für diese Vorlage.</p>
    </article>
  </main>
  <script src="../invite.js"></script>
</body>
</html>
