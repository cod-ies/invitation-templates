<!DOCTYPE html>
<html lang="de">
<head>

  <title>Clara & Henrik — Elfenbein</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

      </div>
    </div>

      <p class="eyebrow">Vorlage · Elfenbein</p>
      <p class="craft">Wachssiegel · Blüten</p>
      <p class="invite-line">ihr seid eingeladen</p>

      <div class="rule"></div>

      <p class="where">Weißer Garten</p>

  <script src="../invite.js"></script>
