<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freya & Nico — Glashaus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../invite.css?v=5">
  <style>
    .env-flap, .door, .iris, .half, .strip, .col, .pane { background-image: url("couple.jpg"); }
  </style>
  <script>if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("reduce");</script>
  <noscript><style>.card{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}.opener{display:none}</style></noscript>

<body>
  <main class="stage" data-invite="glass" style="--photo:url('couple.jpg');--focus:center 26%">
    <img class="photo-bg" src="couple.jpg" alt="">
    <div class="opener">
      <div class="mech panes"><div class="pane"></div><div class="pane"></div><div class="pane"></div><div class="pane"></div></div>
      <div class="seal-wrap">
        <button class="seal" type="button" aria-expanded="false" aria-label="Öffnet das Siegel">
          <span class="wax"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" d="M18 46c12-2 28-16 28-30-14 0-28 16-28 30z"/><path stroke="currentColor" stroke-width="2" d="M22 42c8-8 14-14 20-18"/></svg></span>
          <span class="hint">Öffnet das Siegel</span>
        </button>
      </div>
    </div>
    <article class="card">
      <p class="eyebrow">Vorlage · Glashaus</p>
      <p class="craft">Laserschnitt</p>
      <p class="invite-line">ihr seid eingeladen</p>
      <h1>Freya<i>&amp;</i>Nico</h1>
      <div class="rule"></div>
      <p class="when">Samstag, 2. Mai 2027<br>15:00 Uhr</p>
      <p class="where">Im Glashaus</p>
      <p class="note">Namen, Tag und Ort sind Beispiele für diese Vorlage.</p>
    </article>
  </main>
  <script src="../invite.js"></script>
</body>
</html>
